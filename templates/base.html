<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}RoadmapLearn{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{% url 'roadmaps:list' %}">Roadmaps</a>
    {% if user.is_authenticated %}
      {{ user.username }} ({{ user.xp }} XP)
      <form method="post" action="{% url 'accounts:logout' %}" style="display:inline">
        {% csrf_token %}<button type="submit">Log out</button>
      </form>
    {% else %}
      <a href="{% url 'accounts:login' %}">Log in</a>
      <a href="{% url 'accounts:signup' %}">Sign up</a>
    {% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
  <hr>
  <small>Roadmap structure inspired by roadmap.sh. Videos belong to their respective creators.</small>
</body>
</html>
