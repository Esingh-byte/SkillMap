<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server error (500) — SkillMap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    :root {
      --paper: #F3EDE2;
      --card: #FBF8F1;
      --ink: #1C1A17;
      --muted: #6B645A;
      --marigold: #F4B942;
      --vermilion: #C8401B;
    }
    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .err-shell {
      max-width: 36rem;
      margin: 4rem auto;
      padding: 0 1.25rem;
      width: 100%;
    }
    .err-card {
      background-color: var(--card);
      border: 2px solid var(--ink);
      border-radius: 6px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 2rem;
    }
    .err-title {
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
      font-size: 1.75rem;
      margin: 0.75rem 0 0.5rem;
    }
    .err-mono {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border: 2px solid var(--ink);
      border-radius: 4px;
      background-color: var(--marigold);
    }
    .err-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      font-weight: 600;
      font-size: 0.9375rem;
      color: var(--ink);
      background-color: var(--marigold);
      border: 2px solid var(--ink);
      border-radius: 4px;
      box-shadow: 4px 4px 0 var(--ink);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="err-shell">
    <section class="err-card" aria-labelledby="err-500-heading">
      <span class="err-mono">ERROR 500</span>
      <h1 id="err-500-heading" class="err-title">Something went wrong on our end.</h1>
      <p style="color: var(--muted); margin: 0 0 1.5rem; line-height: 1.6;">
        We hit an unexpected server error while loading this page. Your saved progress and quiz records are safe.
      </p>
      <a href="/roadmaps/" class="err-btn">Back to roadmaps</a>
    </section>
  </main>
</body>
</html>
